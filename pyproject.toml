[project]
name = "lacrei-saude-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "IsabelleNascimento",email = "belinha0nas@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.7"
djangorestframework = "^3.15.2"
psycopg2-binary = "^2.9.12"
python-dotenv = "^1.0.1"
django-cors-headers = "^4.9.0"

[tool.poetry]
packages = [{include = "lacrei_saude_backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
