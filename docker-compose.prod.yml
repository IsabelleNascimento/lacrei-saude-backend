services:
  db:
    image: postgres:15
    container_name: postgres-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg-data-prod:/var/lib/postgresql/data
    networks:
      - app-network-prod
    restart: always

  web:
    build: .
    container_name: lacrei-web-prod
    command: gunicorn setup.wsgi:application --chdir src --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile - --capture-output
    volumes:
      - .:/code
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
    depends_on:
      - db
    networks:
      - app-network-prod
    restart: always

web-staging:
    build: .
    container_name: lacrei-web-staging
    command: gunicorn setup.wsgi:application --chdir src --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile - --capture-output
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      - DATABASE_HOST=db
    depends_on:
      - db
    networks:
      - app-network-prod
    restart: always

networks:
  app-network-prod:

volumes:
  pg-data-prod: