name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Poetry
      run: pip install poetry

    - name: Install dependencies (including dev group)
      run: poetry install --no-root

    - name: Run Ruff lint check
      run: poetry run ruff check .

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file for testing
      run: |
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=django-insecure-ci-test-key-github-actions" >> .env
        echo "DB_NAME=myapp" >> .env
        echo "DB_USER=user" >> .env
        echo "DB_PASSWORD=password" >> .env
        echo "DB_HOST=db" >> .env
        echo "DB_PORT=5432" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

    - name: Build Docker images
      run: docker compose build

    - name: Start containers
      run: docker compose up -d

    - name: Wait for database to be ready
      run: sleep 10

    - name: Run database migrations
      run: docker compose exec -T web python src/manage.py migrate

    - name: Run automated tests
      run: docker compose exec -T web python src/manage.py test consultas

    - name: Shutdown containers
      if: always()
      run: docker compose down